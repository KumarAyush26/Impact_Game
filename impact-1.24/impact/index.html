<!DOCTYPE html>
<html>
<head>
	<title>Impact Game</title>
	<style type="text/css">
		html,body {
			background-color: #333;
			color: #fff;
			font-family: helvetica, arial, sans-serif;
			margin: 0;
			padding: 0;
			font-size: 12pt;
		}
		
		#canvas {
			position: absolute;
			left: 0;
			right: 0;
			top: 0;
			bottom: 0;
			margin: auto;
		}
		
		#debug {
			position: absolute;
			top: 10px;
			left: 10px;
			background: rgba(0,0,0,0.9);
			color: #0f0;
			padding: 10px;
			font-size: 10pt;
			max-height: 300px;
			max-width: 400px;
			overflow-y: auto;
			font-family: monospace;
		}
	</style>

	<script type="text/javascript">
		window.debugLogs = [];
		window.addEventListener('error', function(e) {
			console.error('ERROR:', e.error);
			window.debugLogs.push('ERROR: ' + e.message);
			updateDebug();
		});
		
		function updateDebug() {
			var el = document.getElementById('debug');
			if (el) el.innerHTML = window.debugLogs.join('<br>');
		}
		
		window.log = function(msg) {
			window.debugLogs.push(msg);
			console.log(msg);
			updateDebug();
		};
		
		window.log('1. Page loading...');
	</script>
	<script type="text/javascript" src="lib/impact/impact.js"></script>
	<script type="text/javascript">
		window.log('2. Impact.js loaded');
	</script>
	<script type="text/javascript" src="lib/game/main.js"></script>
	<script type="text/javascript">
		window.log('3. Main.js loaded - game should start');
	</script>
</head>
<body>
	<div id="debug"></div>
	<canvas id="canvas"></canvas>
	<script>
		setTimeout(function() {
			if (!window.ig || !window.ig.system) {
				window.log('ERROR: Impact engine not initialized!');
			} else {
				window.log('4. Impact engine ready!');
			}
		}, 500);
	</script>
</body>
</html>
